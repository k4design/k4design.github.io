<style id="step-overrides">
  /* ---- Timeline (15s) ----
      1.50% - 67.00%  "Sell in 3 steps" with Step 1 -> 2 -> 3
     67.50% - 100%     "Cash Offer / Fast" + "Get a cash offer in 48 hours": slide in,
                        then HOLD at full opacity to the end of the loop (no fade-out).
     Steps: labels only fade, back-to-back; the line under each slides in from the
     right and out to the left. Figma's Group_7/8 and _3 animations are parked. */
  #Group_7, #Group_8 { animation:none; opacity:1; }
  #_3 { animation:none; opacity:1; }
  #Step_1_, #Step_2_, #Step_3_ { opacity:0; }
  #Enter_your_address, #Get_your_offer, #Review_and_decide { transform-origin:0 0; opacity:0; }

/* headline: in at the top of the loop, out with step 3 (Figma's slide distance and easing) */
@keyframes kf_headline {
  0%, 1.5% { transform:translate(27.451px,22.513px) translateX(-195.73px); opacity:0; animation-timing-function:linear; }
  2.99% { opacity:1; }
  3.83% { transform:translate(27.451px,22.513px) translateX(0.27px); opacity:1; }
  64.5% { transform:translate(27.451px,22.513px) translateX(0.27px); opacity:1; animation-timing-function:linear; }
  67.0%, 100% { transform:translate(27.451px,22.513px) translateX(-195.73px); opacity:0; }
}
/* end section: slides in and stays put */
@keyframes kf_end_cashoffer {
  0%, 67.5% { transform:translateX(4.73px) translateX(-195.73px); opacity:0; animation-timing-function:linear; }
  68.32% { opacity:0; animation-timing-function:cubic-bezier(0.5,0,0.5,1); }
  69.83% { transform:translateX(4.73px) translateX(0.27px); opacity:1; }
  100% { transform:translateX(4.73px) translateX(0.27px); opacity:1; }
}
/* "Get a cash offer" arrives from the left, "in 48 hours" from the right, together */
@keyframes kf_end_offer_line {
  0%, 67.98% { transform:translateX(-195.73px); opacity:0; animation-timing-function:linear; }
  70.31% { transform:translateX(0.27px); opacity:1; }
  100% { transform:translateX(0.27px); opacity:1; }
}
@keyframes kf_end_hours_line {
  0%, 67.98% { transform:translateX(195.73px); opacity:0; animation-timing-function:linear; }
  70.31% { transform:translateX(0.27px); opacity:1; }
  100% { transform:translateX(0.27px); opacity:1; }
}
@keyframes kf_end_48hours {
  0%, 67.98% { transform:translate(8.003px,105.852px) translateX(-195.73px); opacity:0; animation-timing-function:linear; }
  70.31% { transform:translate(8.003px,105.852px) translateX(0.27px); opacity:1; }
  100% { transform:translate(8.003px,105.852px) translateX(0.27px); opacity:1; }
}

}
@keyframes kf_step1_txt {

  6.5% { transform:translate(31.0127px,153.325px) translateX(0px); opacity:1; animation-timing-function:linear; }
  24.0% { transform:translate(31.0127px,153.325px) translateX(0px); opacity:1; animation-timing-function:cubic-bezier(0.5,0,0.5,1); }

<script type="text/javascript">
  // Some environments pause autoplay; nudge playback whenever possible.
  (function () {
    var v = document.querySelector('#ad video'), ad = document.getElementById('ad');
    // The still under the video is always there; the video is only shown once it is
    // genuinely playing, and hidden again if it stalls. Nothing is decided early, so a
    // slow or briefly refused start can never strand the ad on the still.
    v.muted = true; v.defaultMuted = true;
    v.addEventListener('playing', function () { ad.className = ''; });
    v.addEventListener('pause',   function () { if (!v.ended) ad.className = 'no-autoplay'; });
    function play() { var p = v.play(); if (p) p.catch(function () {}); }
    // Keep the footage in step with the 15s timeline: stretch anything that isn't 15s
    // (the WebM is 10s) and re-sync to frame 0 every time the CSS loop wraps.
    var LOOP = 15;
    v.addEventListener('loadedmetadata', function () {
      if (isFinite(v.duration) && v.duration > 0 && Math.abs(v.duration - LOOP) > 0.05) {
        v.defaultPlaybackRate = v.playbackRate = v.duration / LOOP;
      }
    });
    v.addEventListener('animationiteration', function (e) {
      if (e.animationName === 'kf_bg_pan') { try { v.currentTime = 0; } catch (x) {} }
    });
    v.addEventListener('loadedmetadata', play);
    v.addEventListener('canplay', play, { once: true });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) play(); });
    if (v.readyState >= 1) play();
    // Safari in Low Power Mode / 'Never Auto-Play': nothing will have started by now
    setTimeout(function () { if (v.paused) ad.className = 'no-autoplay'; }, 4000);
  })();
</script>
