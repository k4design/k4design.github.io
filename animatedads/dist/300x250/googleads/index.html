<style>
  :root { color-scheme: light; }
  html,body { margin:0; padding:0; background:#0E1A03; overflow:hidden; }
  #ad {
    position:relative;
    width:300px; height:250px;
    overflow:hidden;
    background:#1E3907;
  }
  /* Native-resolution frame (352x256) placed so the 50px pan sweeps the full
     width without ever exposing an edge. 1:1 pixels, no upscaling. */
  #ad #bg {
    position:absolute;
    left:-51px; top:-3px;
    width:352px; height:256px;
    object-fit:cover;
    display:block;
    will-change:transform;
    animation: kf_bg_pan 15s linear infinite;
  }
  @keyframes kf_bg_pan {
    0%   { transform: translateX(0px); }
    100% { transform: translateX(50px); }
  }
  #ad svg {
    position:absolute; inset:0;
    width:100%; height:100%;
  }

  /* Nudge the CTA up and down to draw the eye, as in the 728x90 build. */
  @keyframes kf_cta_bob {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
  }
  #cta_bob { animation: kf_cta_bob 1.9s ease-in-out infinite; }
</style>
