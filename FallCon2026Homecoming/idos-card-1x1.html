<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDOS Card · 1x1</title>
<!-- ============================================================
     FallCon IDOS share card — 1x1 (1080x1080).
     Layout + behaviour are shared: idos-card.css / idos-card.js.
     This file carries only the ratio flag and the five fields.
     Edit the spans marked EDIT, or pass them in as query params:
       ?word=LEGACY&statement=...&name=Jessica%20Alvarez&initials=JA&photo=img/headshot.jpg
     Limits designed to: word <=10 chars, statement <=120, name <=28.
     Longer copy auto-fits; see idos-card.js for the degradation order.
     Assets resolve against ./img/.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Inter:wght@500;600;700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Inter:wght@500;600;700&display=block">
<link rel="stylesheet" href="idos-card.css">
</head>
<body>
  <div class="card" data-ratio="1x1">
    <div class="dots" aria-hidden="true"></div>
    <div class="ghost" aria-hidden="true">26</div>

    <header class="head">
      <div class="rule" aria-hidden="true"></div>
      <img class="logo" src="img/logo_h.png" alt="FallCon 2026 — Homecoming">
    </header>

    <div class="body">
      <div class="eyebrow">MY INDIVIDUAL DEFINITION OF SUCCESS</div>
      <div class="means">SUCCESS MEANS —</div>

      <!-- EDIT: the big word -->
      <div class="word">LEGACY</div>

      <!-- EDIT: feeling / number / who -->
      <p class="statement">To feel freedom, reach 50 deals, for my two kids.</p>
    </div>

    <footer class="foot">
      <div class="invite">
        <p class="invite-line">Join me at FallCon 2026 - Homecoming in Lakeland, FL October 6th through the 8th.</p>
        <!-- EDIT: agent name -->
        <p class="invite-name">— Jessica Alvarez</p>
      </div>

      <!-- EDIT: initials are the empty state; drop a local file at img/headshot.jpg
           (or point the <img> anywhere local) and it takes over automatically.
           If the file is missing the <img> removes itself and the monogram shows. -->
      <figure class="headshot" data-initials="JA">
        <img src="img/headshot.jpg" alt="Agent headshot">
      </figure>
    </footer>
  </div>
  <script src="idos-card.js"></script>
</body>
</html>
