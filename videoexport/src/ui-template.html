<style>
  :root {
    --bg: #0b0d12;
    --panel: rgba(255,255,255,0.035);
    --panel-solid: #12151d;
    --border: rgba(255,255,255,0.09);
    --border-bright: rgba(255,255,255,0.18);
    --text: #eef1f7;
    --muted: #8b93a5;
    --dim: #5c6373;
    --blue: #3d9bff;
    --violet: #8b6cff;
    --cyan: #38e1d4;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f0475c;
    --grad: linear-gradient(93deg, #3d9bff 0%, #8b6cff 60%, #38e1d4 120%);
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  /* the page never scrolls; a column layout adapts to the window height so
     the preview and its timeline controls are always fully visible */
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font: 11px/1.5 Inter, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 90% 40% at 50% -10%, rgba(61,155,255,0.10), transparent 70%),
      var(--bg);
    padding: 14px 14px 18px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(61,155,255,0.35); }

  h1 {
    font-size: 13px; font-weight: 750; letter-spacing: -0.2px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  h1::before {
    content: "🎬";
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 6px; font-size: 11px;
    background: var(--grad);
  }
  h1 .ver {
    margin-left: auto;
    font: 9px var(--mono); letter-spacing: 1px; color: var(--dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px;
  }

  .settings { display: flex; gap: 10px; margin-bottom: 12px; }
  .settings label {
    display: flex; flex-direction: column; gap: 4px;
    font: 9px var(--mono); letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--dim);
  }
  select, input[type="number"] {
    background: var(--panel-solid); color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 8px;
    font: 11px Inter, -apple-system, sans-serif;
    outline: none;
    transition: border-color .15s;
  }
  select:hover, input[type="number"]:hover { border-color: var(--border-bright); }
  select:focus, input[type="number"]:focus { border-color: var(--blue); }
  input[type="number"] { width: 52px; }

  #frame-list {
    background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px;
    overflow-y: auto; margin-bottom: 12px;
    max-height: 330px;
    flex: 0 1 auto;
    min-height: 56px; /* compresses (and scrolls) before anything below is pushed out */
  }
  #frame-list::-webkit-scrollbar { width: 8px; }
  #frame-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
  .empty { padding: 18px 16px; color: var(--muted); text-align: center; }
  .frame-row {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 9px 11px; border-bottom: 1px solid var(--border);
    transition: background .12s;
  }
  .frame-row:hover { background: rgba(255,255,255,0.03); }
  .frame-row:last-child { border-bottom: none; }
  .frame-row.excluded { opacity: 0.4; }
  .frame-row input[type="checkbox"] { accent-color: var(--blue); margin-top: 2px; }
  .frame-info { flex: 1; min-width: 0; }
  .frame-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .frame-meta { font: 9.5px var(--mono); color: var(--dim); margin-top: 1px; }
  .frame-controls { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 55%; }
  .hold { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .video-badge {
    font: 9.5px var(--mono);
    background: rgba(251,191,36,0.09); color: var(--amber);
    border: 1px solid rgba(251,191,36,0.25);
    border-radius: 5px; padding: 2px 7px; text-align: right;
  }
  .video-badge.ok {
    background: rgba(74,222,128,0.08); color: var(--green);
    border-color: rgba(74,222,128,0.25);
  }
  .warn { color: var(--amber); font-size: 10px; text-align: right; opacity: 0.8; }

  button {
    background: var(--panel-solid); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s, box-shadow .15s;
  }
  button:hover { border-color: var(--border-bright); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: default; transform: none; }
  #export-btn {
    background: var(--grad); border: none; color: #fff;
    box-shadow: 0 4px 18px rgba(61,155,255,0.35);
  }
  #export-btn:not(:disabled):hover { box-shadow: 0 6px 24px rgba(61,155,255,0.5); }
  button.small { padding: 3px 9px; font-weight: 500; font-size: 10px; }
  button.danger {
    background: rgba(240,71,92,0.12); color: var(--red);
    border-color: rgba(240,71,92,0.35);
  }
  button.danger:hover { background: rgba(240,71,92,0.2); border-color: var(--red); }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }

  #progress-wrap { display: none; margin-top: 12px; flex-shrink: 0; }
  #progress-track {
    background: var(--panel-solid); border: 1px solid var(--border);
    border-radius: 5px; height: 8px; overflow: hidden;
  }
  #progress-bar {
    background: var(--grad); height: 100%; width: 0;
    transition: width .2s; border-radius: 5px;
    box-shadow: 0 0 10px rgba(61,155,255,0.5);
  }
  #progress-label { margin-top: 6px; font: 10px var(--mono); color: var(--muted); }

  #preview-wrap { display: none; margin-top: 12px; flex: 0 1 auto; min-height: 0; }
  #preview-wrap.open { display: flex; flex-direction: column; }
  #preview-label {
    font: 9px var(--mono); letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--dim); margin-bottom: 6px; flex-shrink: 0;
  }
  #preview-canvas, #preview-video {
    width: 100%; display: block; border-radius: 10px;
    background: #000; border: 1px solid var(--border);
    /* shrink to whatever height remains so the controls below never clip */
    flex: 0 1 auto; min-height: 24px; max-height: 45vh;
    object-fit: contain;
  }
  #preview-controls { display: none; align-items: center; gap: 9px; margin-top: 9px; flex-shrink: 0; }
  #preview-play {
    border-radius: 8px; padding: 4px 0; font-size: 11px;
    width: 34px; flex-shrink: 0; text-align: center;
  }
  #preview-scrub {
    flex: 1; accent-color: var(--blue); margin: 0;
    height: 4px; cursor: pointer;
  }
  #preview-time { font: 10px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  #resize-handle {
    position: fixed; left: 0; right: 0; bottom: 0; height: 14px;
    cursor: ns-resize; display: flex; align-items: center; justify-content: center;
  }
  #resize-handle::after {
    content: ""; width: 38px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.14);
    transition: background .15s, width .15s;
  }
  #resize-handle:hover::after { background: var(--blue); width: 52px; }
</style>

<h1>Frame to MP4 <span class="ver">v1.0 · LOCAL</span></h1>

<div class="settings">
  <label>Frame rate
    <select id="fps">
      <option value="24">24 fps</option>
      <option value="30" selected>30 fps</option>
      <option value="60">60 fps</option>
    </select>
  </label>
  <label>Resolution
    <select id="scale">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="3">3×</option>
    </select>
  </label>
  <label>Crossfade
    <select id="fade">
      <option value="0" selected>None</option>
      <option value="0.3">0.3 s</option>
      <option value="0.5">0.5 s</option>
      <option value="1">1 s</option>
    </select>
  </label>
</div>

<div id="frame-list"></div>

<div class="actions">
  <button id="export-btn">Export MP4</button>
  <button id="preview-btn" class="secondary">Preview</button>
  <button id="refresh-btn" class="secondary">Refresh frames</button>
  <button id="cancel-btn" class="danger" style="display:none">Cancel</button>
</div>

<div id="progress-wrap">
  <div id="progress-track"><div id="progress-bar"></div></div>
  <div id="progress-label"></div>
</div>

<div id="preview-wrap">
  <div id="preview-label">Preview</div>
  <canvas id="preview-canvas"></canvas>
  <video id="preview-video" controls style="display:none"></video>
  <div id="preview-controls">
    <button id="preview-play">▶</button>
    <input id="preview-scrub" type="range" min="0" max="1000" step="1" value="0">
    <div id="preview-time">0.0 / 0.0s</div>
  </div>
</div>

<div id="resize-handle" title="Drag to resize"></div>

<script>/*__UI_JS__*/</script>
