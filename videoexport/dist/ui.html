<!-- Plugin UI shell: Figma's plugin iframe is not a secure context, so WebCodecs
     is unavailable there. The real UI + encoder runs in a nested iframe on a
     real HTTPS origin (GitHub Pages); this shell just relays messages. -->
<style>
  html, body { margin: 0; height: 100%; background: #2c2c2c; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #offline { display: none; color: #eee; font: 12px/1.5 Inter, sans-serif; padding: 16px; }
</style>
<div id="offline">
  Couldn't load the encoder UI from<br>
  <b>https://k4design.github.io/videoexport/app/</b><br><br>
  Make sure the videoexport folder is pushed to GitHub Pages and you're online.
</div>
<iframe id="inner" src="https://k4design.github.io/videoexport/app/"></iframe>
<script>
  const APP_ORIGIN = new URL('https://k4design.github.io/videoexport/app/').origin;
  const inner = document.getElementById('inner');
  let loaded = false;
  inner.addEventListener('load', () => { loaded = true; });
  setTimeout(() => {
    if (!loaded) {
      document.getElementById('offline').style.display = 'block';
      inner.style.display = 'none';
    }
  }, 8000);
  window.addEventListener('message', (e) => {
    if (e.source === inner.contentWindow) {
      // from encoder app → to Figma sandbox
      parent.postMessage(e.data, '*');
    } else {
      // from Figma sandbox → to encoder app
      inner.contentWindow.postMessage(e.data, APP_ORIGIN);
    }
  });
</script>
